name: EVA Go verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build station
        run: go build ./cmd/eva-station
